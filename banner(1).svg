<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Royston Jhowin" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&amp;display=swap');
      .name { font-family: 'Fraunces', Georgia, serif; font-size: 70px; fill: #F3EEE3; letter-spacing: -0.5px; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10151C"/>
      <stop offset="100%" stop-color="#171D27"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#E2A63C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E2A63C" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- name -->
  <text x="72" y="172" class="name">Royston Jhowin</text>

  <!-- low-poly 3D avatar: faceted gem head + shoulders, lit from upper-left -->
  <g transform="translate(985,150) scale(0.78)">
    <ellipse cx="0" cy="130" rx="95" ry="16" fill="#05080C" opacity="0.45" filter="url(#soft)"/>

    <!-- shoulders, two facets -->
    <polygon points="-55,20 0,20 0,115 -85,115" fill="#E9B653"/>
    <polygon points="0,20 55,20 85,115 0,115" fill="#C88A2C"/>
    <rect x="-55" y="18" width="110" height="4" fill="#05080C" opacity="0.25"/>

    <!-- faceted head, six triangles fanning from center -->
    <polygon points="0,-40 -47.6,-67.5 0,-95"     fill="#F4C766"/>
    <polygon points="0,-40 0,-95 47.6,-67.5"       fill="#E2A63C"/>
    <polygon points="0,-40 47.6,-67.5 47.6,-12.5"  fill="#C88A2C"/>
    <polygon points="0,-40 47.6,-12.5 0,15"        fill="#A66F20"/>
    <polygon points="0,-40 0,15 -47.6,-12.5"       fill="#C88A2C"/>
    <polygon points="0,-40 -47.6,-12.5 -47.6,-67.5" fill="#E9B653"/>

    <!-- specular highlight along the lit edge -->
    <line x1="-47.6" y1="-67.5" x2="0" y2="-95" stroke="#FBE0A6" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
